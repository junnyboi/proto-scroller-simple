<html lang="en">

		<title>Game template - scroller</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
}

html, body {
	position: fixed;
	inset: 0;
	width: 100vw;
	width: 100dvw;
	height: 100vh;
	height: 100dvh;
	min-width: 0;
	min-height: 0;
	max-width: none;
	max-height: none;
	overflow: hidden;
}

#title-poster-backdrop, #title-video-backdrop {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	border: 0;
	object-fit: cover;
	opacity: 0;
	pointer-events: none;
	transition: opacity 180ms ease-out;
}

#title-poster-backdrop {
	z-index: 0;
}

#title-poster-backdrop img {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
}

#title-video-backdrop {
	z-index: 1;
}

body.title-backdrop-active #title-poster-backdrop,
body.title-backdrop-active #title-video-backdrop.is-ready {
	opacity: 1;
}

#canvas {
	position: fixed;
	inset: 0;
	z-index: 2;
	width: 100vw;
	width: 100dvw;
	height: 100vh;
	height: 100dvh;
	min-width: 0;
	min-height: 0;
	max-width: none;
	max-height: none;
}

#status {
	z-index: 3;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {

		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {

		} else if (typeof err === 'string') {
